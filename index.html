<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1b1f23">
  <meta name="description" content="Wheel settings and setup recommendations for Forza Motorsport and F1 25 on a MOZA R3.">
  <title>Morris Racing</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-game="forza">
  <header class="top">
    <div class="leds" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span>
    </div>
    <div class="top-row">
      <h1>
        <svg class="logo" viewBox="0 0 40 40" aria-hidden="true">
          <circle class="rim" cx="20" cy="21" r="15" fill="none" stroke-width="4.5"/>
          <rect class="gold" x="18.25" y="3.2" width="3.5" height="6.5" rx="1"/>
          <path class="spoke" d="M5.5 21H12.5M27.5 21H34.5M20 28.5V35.5" stroke-width="3.5" stroke-linecap="round"/>
          <circle class="hub" cx="20" cy="21" r="7.6" stroke-width="1.5"/>
          <text class="m" x="20" y="25" text-anchor="middle">M</text>
        </svg>
        Morris Racing
      </h1>
      <div class="game-switch" role="radiogroup" aria-label="Game">
        <button type="button" role="radio" data-game="forza" aria-checked="true">Forza</button>
        <button type="button" role="radio" data-game="f1" aria-checked="false">F1 25</button>
      </div>
    </div>
  </header>

  <main id="view" tabindex="-1"></main>

  <nav class="tabs" aria-label="Sections">
    <button type="button" data-tab="wheel" aria-current="page">Wheel</button>
    <button type="button" data-tab="setup">Setup</button>
    <button type="button" data-tab="fix">Fix it</button>
    <button type="button" data-tab="garage" class="forza-only">Garage</button>
    <button type="button" data-tab="data">Data</button>
    <button type="button" data-tab="saved">Saved</button>
  </nav>

  <div class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
